# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# ── 한/영 전환 실수 보완 규칙 ─────────────────────────────────────────
# 영문 트리거마다 세 가지 입력 경로를 모두 받는다.
#   1) 원래 트리거              예: @sp
#   2) 접두 기호 뒤 스페이스     예: "@ sp"
#      한글 상태로 @를 친 뒤 Shift+Space로 영어 전환하면 전환키의 스페이스가
#      espanso 버퍼에 남아 이렇게 잡힌다. 화면에는 없는 스페이스까지 지우려 해서
#      접두 기호 앞 글자 하나가 같이 지워질 수 있다 → 줄 맨 앞에서 칠 때만 무해.
#   3) 한글 자판 그대로          예: @ㄴㅔ  (s=ㄴ, p=ㅔ)
#      영어 전환을 잊고 같은 키를 눌렀을 때. 두벌식 키 대응은 아래와 같다.
#        q ㅂ  w ㅈ  e ㄷ  r ㄱ  t ㅅ  y ㅛ  u ㅕ  i ㅑ  o ㅐ  p ㅔ
#        a ㅁ  s ㄴ  d ㅇ  f ㄹ  g ㅎ  h ㅗ  j ㅓ  k ㅏ  l ㅣ
#        z ㅋ  x ㅌ  c ㅊ  v ㅍ  b ㅠ  n ㅜ  m ㅡ
#      단, 치는 도중 완성 음절이 "확정"되는 트리거(todo→새애, sleep→닏데 등)는
#      확정 음절이 백스페이스 한 번에 통째로 지워져 앞 글자를 추가로 먹으므로
#      한글 변형을 넣지 않았다. 조합 중인 글자(네, 나, 드 등)는 자모 단위로 지워져 안전.
# 기호로만 된 트리거(@1, @>, -> 등)는 한/영 상태와 무관하므로 그대로 둔다.
# ──────────────────────────────────────────────────────────────────────

matches:
  # Automatically generated by espanso migration tool
  # Original file: default.yml

  # Arrow and Symbol Shortcuts
  - trigger: "@>"
    replace: "[Note]"
  - trigger: "@<"
    replace: ◀
  - trigger: "@,"
    replace: ▼
  - trigger: "\\>>"
    replace: 》
  - trigger: "\\<<"
    replace: 《

  # Numbered Circles
  - trigger: "@1"
    replace: ➊
  - trigger: "@2"
    replace: ➋
  - trigger: "@3"
    replace: ➌
  - trigger: "@4"
    replace: ➍
  - trigger: "@5"
    replace: ➎
  - trigger: "@6"
    replace: ➏
  - trigger: "@7"
    replace: ➐
  - trigger: "@8"
    replace: ➑
  - trigger: "@9"
    replace: ➒

  # Special Characters
  - trigger: "@-"
    replace: ━
  - triggers: ["\\dot", "\\ dot", "\\ㅇㅐㅅ"]
    replace: ·
  - trigger: "->"
    replace: ➝

  # Text Templates
  - trigger: "\\..."
    replace: ... 생략 ...
  - triggers: ["\\todo", "\\ todo"]            # 한글 변형 제외: ㅅㅐㅇㅐ → '새' 확정
    replace: <todo> 01
  - triggers: ["\\note", "\\ note", "\\ㅜㅐㅅㄷ"]
    replace: <note></note>
  - triggers: ["\\lv", "\\ lv", "\\ㅣㅍ"]
    replace: 단계
  - triggers: ["@ssh", "@ ssh", "@ㄴㄴㅗ"]
    replace: "ssh -p 20022 canine@rabbitlab.co.kr"
  - triggers: ["@sp", "@ sp", "@ㄴㅔ"]
    replace: "--dangerously-skip-permissions"
  - triggers: ["@cd", "@ cd", "@ㅊㅇ"]
    replace: "claude --dangerously-skip-permissions"

  # Lorem Ipsum
  - triggers: ["@lorem", "@ lorem", "@ㅣㅐㄱㄷㅡ"]
    replace: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged. It was popularised in the 1960s with the release of Letraset sheets containing Lorem Ipsum passages, and more recently with desktop publishing software like Aldus PageMaker including versions of Lorem Ipsum."

  # Path Shortcut
  - triggers: ["@desk", "@ desk", "@ㅇㄷㄴㅏ"]
    replace: "C:\\Users\\phk70\\Desktop"

  # macOS Sleep Management
  - triggers: ["@sleep", "@ sleep"]            # 한글 변형 제외: ㄴㅣㄷㄷㅔ → '닏' 확정
    replace: "sudo pmset disablesleep 1"
  - triggers: ["@dontsleep", "@ dontsleep"]    # 한글 변형 제외: 애·닏 확정
    replace: "sudo pmset disablesleep 0"

  # Date Formatter
  - triggers: [":date", ": date", ":ㅇㅁㅅㄷ"]
    replace: "{{mytime}}"
    vars:
      - name: mytime
        type: date
        params:
          format: "%Y.%m.%d."
